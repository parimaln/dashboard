name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tier 1 config: non-secret values, safe to bake into a public image.
      #
      # Nothing secret is injected here. Tokens, LAN addresses and calendar URLs
      # are read from the host's .env at container start, which is what makes this
      # image publishable and reusable by other people.
      - name: Apply repository configuration variables
        env:
          PUBLIC_CONFIG: ${{ vars.PUBLIC_CONFIG }}
        run: |
          if [ -n "$PUBLIC_CONFIG" ]; then
            echo "$PUBLIC_CONFIG" > config/public.json
            node -e "JSON.parse(require('fs').readFileSync('config/public.json','utf8'))" \
              || { echo '::error::vars.PUBLIC_CONFIG is not valid JSON'; exit 1; }
            echo "Using config from the PUBLIC_CONFIG repository variable."
          else
            echo "PUBLIC_CONFIG variable is not set; the image ships config/public.example.json."
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          # arm64 so the same image runs on a Raspberry Pi or an ARM NAS.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "ghcr.io/${{ github.repository }}:latest"
            echo "ghcr.io/${{ github.repository }}:sha-${{ github.sha }}"
            echo '```'
            echo
            echo "Watchtower on your Docker host will pull this within its poll interval."
          } >> "$GITHUB_STEP_SUMMARY"
